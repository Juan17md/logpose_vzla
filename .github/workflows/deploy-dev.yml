name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vincular proyecto Vercel
        run: npx vercel@latest link --yes --project logpose-vzla --team juan17md-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Extraer variables de entorno preview
        run: npx vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construir proyecto
        run: npx vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Desplegar preview y fijar dominio dev
        run: |
          URL="$(npx vercel@latest deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          npx vercel@latest alias set "$URL" logpose-vzla-dev.vercel.app --token=${{ secrets.VERCEL_TOKEN }}